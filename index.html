<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanBreathe — Air-quality estimates for Indian cities</title>
    <meta name="description" content="CPCB NAQI-method estimates from modelled CAMS data for ten Indian cities, with a 72-hour model forecast, illustrative scenarios, a printable situation brief and a multilingual citizen advisory. Every value shows its source and time." />
    <meta name="theme-color" content="#2675dc" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://urban-breathe-nine.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UrbanBreathe" />
    <meta property="og:title" content="UrbanBreathe — Air-quality estimates for Indian cities" />
    <meta property="og:description" content="CPCB NAQI-method estimates from modelled CAMS data, with provenance, a 72-hour model forecast and a citizen advisory. Not official CPCB station AQI." />
    <meta property="og:url" content="https://urban-breathe-nine.vercel.app/" />
    <meta property="og:image" content="https://urban-breathe-nine.vercel.app/og-image.png" />
    <meta property="og:image:alt" content="UrbanBreathe air-quality dashboard" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved or system colour scheme before first paint (no flash).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('urbanbreathe_theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add('theme-' + theme);
      })();
    </script>
  </head>
  <body>
    <noscript>UrbanBreathe needs JavaScript to load air-quality data.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
